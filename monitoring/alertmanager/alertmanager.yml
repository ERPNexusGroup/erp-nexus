# AlertManager — ERP Nexus
# Gestiona y enruta alertas desde Prometheus hacia canales de notificación

global:
  resolve_timeout: 5m
  # Plantilla común para todas las alertas
  templates:
    - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'slack-erp-nexus'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  group_by: ['alertname', 'service', 'severity']
  # Rutas anidadas (más específicas primero)
  routes:
    # ─── Críticas: notificación inmediata (Slack + Telegram) ─────────────────
    - match:
        severity: critical
      receiver: 'slack-erp-nexus'
      continue: false

    # ─── Warnings: agregar email ─────────────────────────────────────────────
    - match:
        severity: warning
      receiver: 'email-admin'
      continue: false

    # ─── Por servicio específico ──────────────────────────────────────────────
    - match:
        service: postgres
      receiver: 'email-db-admin'
      continue: false

    - match:
        service: redis
      receiver: 'email-devops'
      continue: false

receivers:
  # ─── Slack (canal #alerts-erp-nexus) ───────────────────────────────────────
  - name: 'slack-erp-nexus'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts-erp-nexus'
        send_resolved: true
        title: '{{ template "slack.title" . }}'
        text: |
          {{ template "slack.text" . }}
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Service:* {{ .Labels.service }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        footer: 'ERP Nexus Monitoring | {{ .Status | upper }}'

  # ─── Email admin general ───────────────────────────────────────────────────
  - name: 'email-admin'
    email_configs:
      - to: '${ADMIN_ALERT_EMAIL}'
        from: '${ALERT_FROM_EMAIL}'
        smarthost: '${SMTP_HOST}'
        headers:
          Subject: '[ERP Nexus] {{ .GroupLabels.alertname }} - {{ .Status }}'
        html: |
          <h3>🚨 ERP Nexus Alert: {{ .GroupLabels.alertname }}</h3>
          <table>
            <tr><td><strong>Status</strong></td><td>{{ .Status | upper }}</td></tr>
            <tr><td><strong>Service</strong></td><td>{{ .Labels.service }}</td></tr>
            <tr><td><strong>Severity</strong></td><td>{{ .Labels.severity }}</td></tr>
            <tr><td><strong>Instance</strong></td><td>{{ .Labels.instance }}</td></tr>
            <tr><td><strong>Summary</strong></td><td>{{ .Annotations.summary }}</td></tr>
            <tr><td><strong>Description</strong></td><td>{{ .Annotations.description }}</td></tr>
          </table>
          <p>Runbook: {{ .Annotations.runbook_url }}</p>

  # ─── Email DB admin ─────────────────────────────────────────────────────────
  - name: 'email-db-admin'
    email_configs:
      - to: '${DB_ADMIN_EMAIL}'
        from: '${ALERT_FROM_EMAIL}'
        smarthost: '${SMTP_HOST}'
        headers:
          Subject: '[ERP Nexus DB] {{ .GroupLabels.alertname }} - {{ .Status }}'

  # ─── Email DevOps ───────────────────────────────────────────────────────────
  - name: 'email-devops'
    email_configs:
      - to: '${DEVOPS_ALERT_EMAIL}'
        from: '${ALERT_FROM_EMAIL}'
        smarthost: '${SMTP_HOST}'

inhibit_rules:
  # Si hay alerta crítica, no enviar warnings del mismo servicio
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']

  # Si DB está caída, inhibir alertas de DB lentas
  - source_match:
      alertname: 'DatabaseDown'
    target_match:
      alertname: 'SlowDatabaseQueries'
    equal: ['service']

templates:
  - '/etc/alertmanager/templates/*.tmpl'
