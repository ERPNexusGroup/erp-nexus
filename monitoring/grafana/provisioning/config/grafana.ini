[server]
# HTTP port
http_port = 3000
# Root URL (set via env GF_SERVER_ROOT_URL if needed)
# enable gzip
enable_gzip = true

[security]
# Admin user/password via env: GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD
admin_password = ${GRAFANA_ADMIN_PASSWORD}
admin_user = ${GRAFANA_ADMIN_USER:-admin}
secret_key = ${GRAFANA_SECRET_KEY:-change-me-please}

[auth]
# Login options
disable_login_form = false
oauth_auto_login = false

[users]
# Allow signed up users
allow_sign_up = false

[smtp]
enabled = true
host = ${SMTP_HOST:-smtp.gmail.com:587}
user = ${SMTP_USER}
password = ${SMTP_PASSWORD}
from_address = ${ALERT_FROM_EMAIL:-alerts@erp-nexus.com}
from_name = ERP Nexus Alerts
startTLS_policy = MandatoryStartTLS

[alerting]
enabled = true
error_or_timeout = alert
nodata_or_nullvalues = alert

[metrics]
enabled = true
basic_auth_username =
basic_auth_password =

[log]
mode = console
level = info
