# ERP Nexus — Docker Compose Producción (v2 — con DB tuning + Redis persistencia)
# Servicios: PostgreSQL 16 (tuned) + Redis 7 (AOF) + Django (Gunicorn)

services:
  # ─── PostgreSQL Database (Production Tuned) ─────────────────────────────────
  db:
    image: postgres:16
    container_name: erp_nexus_db
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c max_connections=100
      -c max_wal_size=1GB
      -c min_wal_size=80MB
      -c log_min_duration_statement=1000  # log queries > 1s
      -c log_rotation_age=1d
      -c log_rotation_size=100MB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp_nexus_net

  # ─── Redis Cache (Production with AOF persistence) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: erp_nexus_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --protected-mode yes
    env_file:
      - .env.prod
    volumes:
      - redisdata:/data
      - ./scripts/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - erp_nexus_net

  # ─── Django Web Application ─────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp_nexus_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_nexus}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    volumes:
      - media:/app/media
      - static:/app/static
      - logs:/app/logs
      - backup:/backup  # Para scripts de backup
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - erp_nexus_net

# ─── Celery Worker (async tasks) ─────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp_nexus_worker
    command: >
      celery -A erp_nexus worker
      --loglevel=info
      --queues=default,sri,notifications,reports,webhooks
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_nexus}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    volumes:
      - logs:/app/logs
    networks:
      - erp_nexus_net
    restart: unless-stopped

# ─── Celery Beat (periodic tasks scheduler) ──────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp_nexus_beat
    command: celery -A erp_nexus beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_nexus}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    volumes:
      - logs:/app/logs
    networks:
      - erp_nexus_net
    restart: unless-stopped

# ─── Nginx Reverse Proxy + SSL (Let's Encrypt) ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: erp_nexus_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_data:/var/lib/letsencrypt:ro
      - static:/app/static:ro
      - media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
      certbot:
        condition: service_started
    networks:
      - erp_nexus_net
    restart: unless-stopped

# ─── Certbot — Auto-renew SSL certificates ─────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: erp_nexus_certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_data:/var/lib/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet --no-self-upgrade; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - erp_nexus_net

# ─── Volúmenes ────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  media:
    driver: local
  static:
    driver: local
  logs:
    driver: local
  redisdata:
    driver: local
  backup:
    driver: local
  certbot_conf:
    driver: local
  certbot_data:
    driver: local

# ─── Red ─────────────────────────────────────────────────────────────────────
networks:
  erp_nexus_net:
    driver: bridge
