version: '3.8'

services:
  # ─── Base de datos PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: erp-nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_nexus
      POSTGRES_USER: erp_nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_nexus_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - erp-nexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache + Celery broker) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: erp-nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - erp-nexus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── ERP Nexus App ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: erp-nexus-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://erp_nexus:${POSTGRES_PASSWORD:-erp_nexus_dev_password}@db:5432/erp_nexus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: erp_nexus.settings.production
    volumes:
      # Mount modules en desarrollo (opcional)
      - ./modules:/app/modules:ro
      # Media files
      - media_volume:/app/media
      # Static files (después de collectstatic)
      - static_volume:/app/static
    ports:
      - "8000:8000"
    networks:
      - erp-nexus
    command: >
      sh -c "
        uv run python manage.py migrate --noinput &&
        uv run python manage.py collectstatic --noinput &&
        gunicorn erp_nexus.asgi:application
          --workers 4
          -k uvicorn.workers.UvicornWorker
          --bind 0.0.0.0:8000
          --access-logfile -
          --error-logfile -
          --log-level info
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Celery Worker (futuro) ─────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: erp-nexus-celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://erp_nexus:${POSTGRES_PASSWORD:-erp_nexus_dev_password}@db:5432/erp_nexus
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: erp_nexus.settings.production
    volumes:
      - ./modules:/app/modules:ro
    networks:
      - erp-nexus
    command: >
      sh -c "
        uv run celery -A erp_nexus worker --loglevel=info
      "
    # Deshabilitado por defecto (sin tareas async aún)
    profiles:
      - celery

  # ─── Flower (monitor Celery) ─────────────────────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: erp-nexus-flower
    restart: unless-stopped
    depends_on:
      - celery
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://erp_nexus:${POSTGRES_PASSWORD:-erp_nexus_dev_password}@db:5432/erp_nexus
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - erp-nexus
    command: >
      sh -c "
        uv run celery -A erp_nexus flower --port=5555
      "
    profiles:
      - celery

  # ─── pgAdmin (opcional) ──────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: erp-nexus-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@erpnexus.ec
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    networks:
      - erp-nexus
    profiles:
      - tools

# ─── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_volume:
    driver: local
  static_volume:
    driver: local

# ─── Redes ─────────────────────────────────────────────────────────────────────
networks:
  erp-nexus:
    driver: bridge
